name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "ruff==0.6.9"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + dev deps (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.4.1" "torchvision==0.19.1"
          pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -q

  smoke-train:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + dev deps (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.4.1" "torchvision==0.19.1"
          pip install -e ".[dev]"
      # F3.AC4: synthetic smoke training must finish in <2 min. The
      # smoke config writes to `models/` by default; we override the
      # output dir to a tmp path so CI never clobbers the shipped
      # `models/model.pt` + class_names.json (which are 6-class per
      # F8.AC2 / G5).
      - name: Run smoke training (synthetic, <2 min)
        run: |
          timeout 120 python -m leafcheck.train --config configs/smoke.yaml \
            --override output_dir=/tmp/ci_smoke_model